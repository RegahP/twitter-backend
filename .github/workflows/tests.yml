name: tests

on:
  push:

defaults:
  run:
    working-directory: node/express-prisma-typescript

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Prisma requires DATABASE_URL to be present for `prisma generate`,
      # but it doesn't need to connect for client generation.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: node/express-prisma-typescript/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Run tests
        run: yarn test
